name: Test Auto merge - Azure
on:
  workflow_dispatch:
    inputs:
      test_user:
        description: 'GitHub username'
        required: true
        type: string
        default: 'NotMaharshi'
  pull_request:
permissions:  # ← Add workflow-level permissions
  contents: read
  checks: read
  pull-requests: write

jobs:
  auto-merge-test:
    uses: ./.github/workflows/shared-auto-merge.yml
    with:
      azure_cloud: true
      test_mode: true
      test_user: ${{ inputs.test_user || github.actor }}
      tfchecks_azure: '["PR Validation / pr-validation", "tf-checks / tf-lint"]'
    secrets: inherit  # ← This passes ALL secrets including GITHUB_TOKEN


