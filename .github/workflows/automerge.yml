name: Test Auto merge - Azure
on:
  workflow_dispatch:
    inputs:
      test_user:
        description: 'GitHub username'
        required: true
        type: string
        default: 'NotMaharshi'
  pull_request:
permissions:  # ← Add workflow-level permissions
  contents: read
  checks: read
  pull-requests: write

jobs:
  auto-merge-test:
    uses: ./.github/workflows/shared-auto-merge.yml
    with:
      azure_cloud: true
      test_mode: true
      test_user: ${{ inputs.test_user || github.actor }}
      tfchecks_azure: '["pr-validation / 📝 Validate PR title", "pr-validation / 🧾 Validate Commit Messages", "tf-lint / tflint"]'
    secrets:
      GITHUB: ${{ secrets.GITHUB_TOKEN }}



